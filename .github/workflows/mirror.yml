name: Mirror Next.js Blog to heyzenex-blog

on:
  push:
    branches:
      - main
    paths:
      - "2025/heyzenexblog-next/**"

jobs:
  mirror:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2025/heyzenexblog-next

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Initialize and push to heyzenex-blog
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          # Create new git repo inside this folder
          git init
          git remote add origin https://zenhuzaini:${MIRROR_TOKEN}@github.com/zenhuzaini/heyzenex-blog.git

          # Stage everything in this folder
          git add .

          # Commit changes if there are any
          git commit -m "Sync from react-projects (2025/heyzenexblog-next) on $(date)" || echo "No changes to commit"

          # Force push to mirror
          git branch -M main
          git push origin main --force
