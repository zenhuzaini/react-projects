name: Mirror Next.js Blog to heyzenex-blog

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Copy Next.js blog folder to temp directory
        run: |
          mkdir -p /tmp/heyzenexblog
          rsync -av --delete 2025/heyzenexblog-next/ /tmp/heyzenexblog/

      - name: Push to heyzenex-blog repository
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd /tmp/heyzenexblog
          git init
          git remote add origin https://zenhuzaini:${MIRROR_TOKEN}@github.com/zenhuzaini/heyzenex-blog.git
          git add .
          git commit -m "Sync from react-projects on $(date)" || echo "No changes to commit"
          git branch -M main
          git push origin main --force
